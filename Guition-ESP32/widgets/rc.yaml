# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Routine Controller UI layer                                             ║
# ║  Lights, Devices, Music, scenes and the bottom navigation are written    ║
# ║  in C++ (Guition-ESP32/rc/*.h). This package wires them to Home          ║
# ║  Assistant: fonts, service calls, Music Assistant search and library.    ║
# ║  Which entities to show comes from rc_home.yaml: tools/gen_rc.py turns   ║
# ║  it into rc/rc_config.h and widgets/rc_entities.yaml (state updates).    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

