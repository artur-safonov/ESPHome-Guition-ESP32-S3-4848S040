# Home Assistant script used by the Routine Controller UI for every button press.
# Add it to scripts.yaml, or paste it into the script editor in YAML mode.
rc_call:
  alias: Routine Controller - call
  description: Calls a service for the Routine Controller display. data is a JSON object (text or mapping).
  mode: parallel
  max: 20
  fields:
    service:
      description: domain.service, for example light.turn_on
      required: true
      selector:
        text: {}
    data:
      description: service data
      required: false
      selector:
        object: {}
  sequence:
    - action: "{{ service }}"
      data: "{{ (data | from_json) if data is string else (data | default({}, true)) }}"
